<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>איור פרוייקטים – קביעת סיסמה</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>איור פרוייקטים</h1><span class="sp"></span></header>
<main>
  <section class="card" id="pwCard">
    <h2>קביעת סיסמה</h2>
    <p class="small" id="who"></p>
    <form id="f">
      <input type="email" name="username" autocomplete="username" id="user" hidden>
      <label for="pw">סיסמה חדשה (8 תווים לפחות)</label>
      <input id="pw" type="password" autocomplete="new-password" required minlength="8">
      <label for="pw2">שוב, לאימות</label>
      <input id="pw2" type="password" autocomplete="new-password" required minlength="8">
      <button class="primary" type="submit">שמירה</button>
    </form>
    <div id="m" class="msg" role="status"></div>
  </section>
  <section class="card" id="pkCard" hidden>
    <h2>כניסה מהירה בזיהוי פנים</h2>
    <p>אפשר להיכנס בפעם הבאה בלי סיסמה – בזיהוי פנים, טביעת אצבע או Windows Hello של המכשיר הזה.</p>
    <button class="primary" id="add">הוסף זיהוי פנים למכשיר הזה</button>
    <button class="second" id="skip">לא עכשיו – לפרויקטים</button>
    <div id="m2" class="msg" role="status"></div>
  </section>
</main>
<script type="module">
import { sb, $, msg, here, canPasskey, addPasskey } from './portal.js';
await new Promise(r => setTimeout(r, 300));   // the invite / reset link's token is read from the address first
const { data } = await sb.auth.getSession();
if (!data.session) { msg($('#m'), 'הקישור פג או כבר נוצל – בקש קישור חדש ("שכחתי סיסמה" בדף הכניסה)', 'bad'); $('#f').hidden = true; }
else { $('#who').textContent = data.session.user.email; $('#user').value = data.session.user.email; }
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if ($('#pw').value !== $('#pw2').value) return msg($('#m'), 'הסיסמאות לא זהות', 'bad');
  const { error } = await sb.auth.updateUser({ password: $('#pw').value });
  if (error) return msg($('#m'), 'השמירה נכשלה: ' + error.message, 'bad');
  msg($('#m'), 'הסיסמה נשמרה', 'ok');
  if (canPasskey()) { $('#pwCard').hidden = true; $('#pkCard').hidden = false; } else location.replace(here('projects.html'));
});
$('#add').addEventListener('click', async () => {
  try { await addPasskey(); msg($('#m2'), 'נוסף. בפעם הבאה – "כניסה בזיהוי פנים"', 'ok'); setTimeout(() => location.replace(here('projects.html')), 1200); }
  catch (e) { msg($('#m2'), e.message || 'ההוספה בוטלה', 'bad'); }
});
$('#skip').addEventListener('click', () => location.replace(here('projects.html')));
</script>
</body></html>
